<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPOTTER — OneDrive PDF Test</title>
<style>
body { margin: 0; font-family: sans-serif; background: #f4f6fb; display: flex; flex-direction: column; height: 100vh; }
#hdr { background: #1e2540; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
#hdr strong { color: #f59e0b; letter-spacing: 2px; }
#status { font-size: 12px; color: #94a3b8; font-family: monospace; }
#main { flex: 1; display: flex; }
#canvas-wrap { flex: 1; background: #d0d4de; overflow-y: auto; display: flex; justify-content: center; padding: 20px; position: relative; }
canvas { box-shadow: 0 4px 20px rgba(0,0,0,.3); }
#arrow { position: absolute; left: 20px; width: 28px; display: none; font-size: 20px; }
#controls { width: 220px; background: #fff; border-right: 1px solid #d8dde8; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
button { padding: 10px; border-radius: 6px; border: 1px solid #d8dde8; background: #2d6ef5; color: #fff; font-size: 13px; cursor: pointer; font-weight: 600; }
button:hover { background: #1a5fd4; }
.info { font-size: 11px; color: #4a5272; line-height: 1.6; }
</style>
</head>
<body>
<div id="hdr">
  <strong>SPOTTER</strong>
  <span>OneDrive PDF Test</span>
  <span id="status">Loading…</span>
</div>
<div id="main">
  <div id="controls">
    <div class="info">
      <strong>Test:</strong> AQA C1F Nov21 QP<br>
      <strong>Source:</strong> Your OneDrive<br>
      <strong>Via:</strong> Cloudflare proxy
    </div>
    <button onclick="loadPage(1)">Page 1</button>
    <button onclick="loadPage(3)">Page 3</button>
    <button onclick="loadPage(5)">Page 5</button>
    <button onclick="showArrowTest()">Test Arrow (Y=300)</button>
    <div id="info" class="info">No page loaded yet</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="pdf-canvas"></canvas>
    <div id="arrow">👉</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

const PROXY = 'https://spotter-proxy.topscienceguru.workers.dev/?url=';
// OneDrive direct download URL
const ONEDRIVE_URL = 'https://ldeutc-my.sharepoint.com/:b:/g/personal/babu_zainulabdeen_ldeutc_co_uk/IQC-yB72-nAhTJI2OxcCSiFSAVYcuZHZPEmTrMEUL1T4Lwg?e=IkRk8w&download=1';

const status = document.getElementById('status');
const info = document.getElementById('info');
const canvas = document.getElementById('pdf-canvas');
const ctx = canvas.getContext('2d');
const arrow = document.getElementById('arrow');

let pdfDoc = null;

// Load PDF through Cloudflare proxy
const fetchUrl = PROXY + encodeURIComponent(ONEDRIVE_URL);
status.textContent = 'Fetching via proxy…';

pdfjsLib.getDocument(fetchUrl).promise.then(doc => {
  pdfDoc = doc;
  status.textContent = `✓ Loaded — ${doc.numPages} pages`;
  info.textContent = `PDF loaded successfully from OneDrive via Cloudflare proxy. ${doc.numPages} pages found.`;
  loadPage(1);
}).catch(err => {
  status.textContent = '✗ Error: ' + err.message;
  info.textContent = 'Failed: ' + err.message;
  console.error(err);
});

window.loadPage = async function(pageNum) {
  if (!pdfDoc) return;
  arrow.style.display = 'none';
  const page = await pdfDoc.getPage(pageNum);
  const wrap = document.getElementById('canvas-wrap');
  const scale = ((wrap.clientWidth - 60) / page.getViewport({scale:1}).width) * 2;
  const vp = page.getViewport({scale});
  canvas.width = vp.width;
  canvas.height = vp.height;
  canvas.style.width = (wrap.clientWidth - 60) + 'px';
  canvas.style.height = Math.round(vp.height/2) + 'px';
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  info.textContent = `Page ${pageNum} rendered. Canvas: ${canvas.width}×${canvas.height}`;
};

window.showArrowTest = function() {
  const y = 300;
  arrow.style.cssText = `display:block;position:absolute;left:20px;top:${y}px;font-size:24px;color:red;`;
  info.textContent = `Arrow shown at Y=300px`;
};
</script>
</body>
</html>
