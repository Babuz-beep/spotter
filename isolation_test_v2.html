<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTTER — isolation test v2 (real PDF pipeline)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f6fb; --bg2: #ffffff; --bg3: #edf0f7;
  --border: #d8dde8; --border2: #c4cad8;
  --accent: #2d6ef5; --accent2: #d97706; --green: #16a34a; --red: #e03150;
  --text: #1e2540; --text2: #4a5272; --text3: #8a93b0;
  --panel: 480px; --hdr: 52px;
  --sans: system-ui, sans-serif; --mono: monospace;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; }
#hdr {
  height: var(--hdr); background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
#logo { font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: 3px; color: var(--accent); }
#back-link { font-size: 11px; color: var(--text3); text-decoration: none; font-family: var(--mono); }
#stats { font-size: 11px; color: var(--text3); font-family: var(--mono); }
#search-wrap { flex: 1; max-width: 340px; }
#search { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; color: var(--text); font-size: 12px; outline: none; }
#btn-top { font-family: var(--mono); font-size: 10px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; }
#panel-toggle { margin-left: auto; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; color: var(--text2); font-size: 11px; font-family: var(--mono); cursor: pointer; white-space: nowrap; display:none; }

#main { display: flex; height: calc(100vh - var(--hdr)); margin-top: var(--hdr); }
#index { flex: 1; overflow-y: auto; padding: 20px 16px 40px; min-width: 0; }
#nav-pills { margin-bottom: 16px; }
.nav-pill { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 5px 12px; margin: 0 6px 6px 0; border: 1px solid var(--border2); border-radius: 20px; color: var(--text2); text-decoration: none; background: var(--bg3); }
.nav-pill:hover { border-color: var(--accent); color: var(--accent); }
.spec-section { margin-bottom: 40px; }
.spec-h2 { font-size: 16px; font-weight: 700; margin: 30px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.spec-tag { font-family: var(--mono); font-size: 11px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 6px; margin-right: 8px; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--border); cursor: pointer; }
.qrow:hover { background: var(--bg3); }
.qrow.active { background: #2d6ef522; }
.pbadge { font-family: var(--mono); font-size: 10px; background: #16a34a22; color: #16a34a; border: 1px solid #16a34a55; border-radius: 4px; padding: 2px 6px; }
.qdesc { flex: 1; }
.btn-q, .btn-a { font-family: var(--mono); font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border2); background: var(--bg2); cursor: pointer; }
.btn-q { color: var(--accent); border-color: var(--accent); }
.btn-a { color: var(--green); border-color: var(--green); }

#drag-handle { width: 6px; background: var(--border); flex-shrink: 0; }
#pdf-panel { width: var(--panel); border-left: 1px solid var(--border); background: var(--bg2); display: flex; flex-direction: column; flex-shrink: 0; }
#pdf-panel.hidden { display: none; }
#panel-hdr { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; min-height: 40px; flex-wrap: wrap; }
#panel-title { flex: 1; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 60px; }
.pctrl { font-family: var(--mono); font-size: 11px; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border2); background: var(--bg2); cursor: pointer; white-space: nowrap; }
.pctrl.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.pctrl-red { color: #fff; background: var(--red); border-color: var(--red); }
.pctrl-green { color: #fff; background: var(--green); border-color: var(--green); }
#pdf-viewport { flex: 1; overflow-y: auto; position: relative; background: #d0d4de; }
#pdf-canvas { display: block; width: 100%; }
#arrow-indicator { position: absolute; left: 0; width: 22px; display: none; z-index: 10; }
#pdf-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); font-size: 12px; }
#loading-bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); display: none; z-index: 20; }

.ref-group { scroll-margin-top: 10px; }
.ref-group.topic-flash { animation: topicFlash 2.2s ease-out; border-radius: 6px; }
@keyframes topicFlash { 0%,70% { background: rgba(45,110,245,0.16); } 100% { background: transparent; } }

#diag { position: fixed; bottom: 10px; left: 10px; background: #111; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 6px; z-index: 999; max-width: 460px; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="hdr">
  <div id="logo">SPOTTER TEST</div>
  <a id="back-link" href="#">← All subjects</a>
  <div id="stats"></div>
  <div id="search-wrap"><input id="search" type="text" placeholder="Search questions…"></div>
  <button id="btn-top" onclick="document.getElementById('index').scrollTop=0">↑ Top of page</button>
  <button id="panel-toggle">⊞ Panel</button>
</div>

<div id="main">
  <div id="index">
    <div id="nav-pills"></div>
    <div id="content"></div>
    <div id="no-results" style="display:none">No matches.</div>
  </div>

  <div id="drag-handle"></div>
  <div id="pdf-panel" class="hidden">
    <div id="panel-hdr">
      <div id="panel-title">Select a question</div>
      <button class="pctrl" id="btn-q-mode">Q</button>
      <button class="pctrl" id="btn-a-mode">A</button>
      <button class="pctrl" id="btn-prev">◀</button>
      <button class="pctrl" id="btn-next">▶</button>
      <button class="pctrl" id="btn-goto">↓ Jump</button>
      <button class="pctrl" id="btn-full">⛶ Full</button>
      <button class="pctrl pctrl-red" id="btn-open-qp">Full Paper</button>
      <button class="pctrl pctrl-green" id="btn-open-ms">Full MS</button>
    </div>
    <div id="pdf-viewport">
      <div id="loading-bar"></div>
      <canvas id="pdf-canvas"></canvas>
      <div id="arrow-indicator"></div>
      <div id="pdf-placeholder"><div style="font-size:24px">📄</div><div>Select a question</div></div>
    </div>
  </div>
</div>

<div id="diag">Diagnostics appear here after you open a question.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

// Real, public, CORS-enabled test PDF (the official PDF.js demo file) —
// standing in for a real AQA paper so the actual PDF.js pipeline runs for real.
const TEST_PDF = 'https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf';
const SCALE = 2.0;

// ── Generate fake content at roughly C2H's real scale ──
const SECTIONS = [
  ['5.1','ATOMIC STRUCTURE AND THE PERIODIC TABLE', 3],
  ['5.3','QUANTITATIVE CHEMISTRY', 8],
  ['5.4','CHEMICAL CHANGES', 4],
  ['5.6','THE RATE AND EXTENT OF CHEMICAL CHANGE', 60],
  ['5.7','ORGANIC CHEMISTRY', 70],
  ['5.8','CHEMICAL ANALYSIS', 50],
  ['5.9','CHEMISTRY OF THE ATMOSPHERE', 60],
  ['5.10','USING RESOURCES', 89],
];
const contentEl = document.getElementById('content');
const pillsEl = document.getElementById('nav-pills');
let qCounter = 0;
for (const [code, title, count] of SECTIONS) {
  const secId = 'sec-' + code.replace('.', '-');
  pillsEl.innerHTML += `<a class="nav-pill" href="#${secId}">→ ${code} ${title}</a>`;
  const section = document.createElement('div');
  section.className = 'spec-section';
  section.id = secId;
  section.innerHTML = `<h2 class="spec-h2"><span class="spec-tag">${code}</span>${title}</h2>`;
  const group = document.createElement('div');
  group.className = 'ref-group';
  group.dataset.topic = code + '.1.1';
  group.innerHTML = `<div style="font-size:11px;color:var(--accent2);margin:10px 0"><span class="spec-tag">${code}.1.1</span> Example topic point</div>`;
  for (let i = 0; i < count; i++) {
    qCounter++;
    const row = document.createElement('div');
    row.className = 'qrow';
    row.dataset.paper = 'Jun25·TEST';
    row.dataset.qnum = qCounter + '.' + ((i%9)+1);
    row.dataset.qpUrl = TEST_PDF;
    row.dataset.msUrl = TEST_PDF;
    row.dataset.qpPage = String((i % 13) + 1);
    row.dataset.msPage = String((i % 13) + 1);
    row.dataset.qpY = '150';
    row.dataset.msY = '150';
    row.dataset.qpFullId = 'test';
    row.dataset.msFullId = 'test';
    row.dataset.qpStart = '1'; row.dataset.qpEnd = '2';
    row.dataset.msStart = '1'; row.dataset.msEnd = '2';
    row.innerHTML = `
      <span class="pbadge">Jun25·TEST</span>
      <span class="qdesc">${row.dataset.qnum} — Example question text</span>
      <button class="btn-q">Q</button>
      <button class="btn-a">A</button>
    `;
    group.appendChild(row);
  }
  section.appendChild(group);
  contentEl.appendChild(section);
}
document.getElementById('stats').textContent = qCounter + ' fake questions · real PDF.js pipeline';

// ══════════════════════════════════════════════════════════════════
// EVERYTHING BELOW THIS LINE IS COPIED VERBATIM FROM THE REAL SITE
// ══════════════════════════════════════════════════════════════════

let currentPdfDoc = null;
let currentPdfUrl = '';
let currentPage = 1;
let currentQNum = '';
let currentMode = 'q';
let currentRow = null;
let panelVisible = false;
let fullscreen = false;
let rendering = false;
let currentStoredY = null;

const viewport   = document.getElementById('pdf-viewport');
const canvas     = document.getElementById('pdf-canvas');
const ctx        = canvas.getContext('2d');
const arrow      = document.getElementById('arrow-indicator');
const placeholder = document.getElementById('pdf-placeholder');
const loadingBar = document.getElementById('loading-bar');
const panelTitle = document.getElementById('panel-title');
const btnQMode   = document.getElementById('btn-q-mode');
const btnAMode   = document.getElementById('btn-a-mode');
const btnGoto    = document.getElementById('btn-goto');
const btnFull    = document.getElementById('btn-full');
const btnOpenQP  = document.getElementById('btn-open-qp');
const btnOpenMS  = document.getElementById('btn-open-ms');
const panelToggle = document.getElementById('panel-toggle');
const pdfPanel   = document.getElementById('pdf-panel');
const searchEl   = document.getElementById('search');

function setLoading(v) { loadingBar.style.display = v ? 'block' : 'none'; }

function showArrow(topY, pageH, isAnswer) {
  const height = Math.max(30, Math.min(60, pageH * 0.04));
  arrow.style.cssText = `display:flex;top:${topY - 4}px;height:${height}px;position:absolute;left:0;width:28px;background:${isAnswer?'#16a34a':'#e03150'};z-index:10;`;
}

async function renderPage(doc, pageNum, qNum, isAnswer) {
  if (rendering) return;
  rendering = true;
  arrow.style.display = 'none';
  placeholder.style.display = 'none';
  canvas.style.display = 'block';
  const page = await doc.getPage(pageNum);
  const displayWidth = viewport.clientWidth || 480;
  const pdfWidth = page.getViewport({ scale: 1 }).width;
  const scale = (displayWidth / pdfWidth) * SCALE;
  const vp = page.getViewport({ scale });
  canvas.width  = vp.width;
  canvas.height = vp.height;
  canvas.style.width  = displayWidth + 'px';
  canvas.style.height = Math.round(vp.height / SCALE) + 'px';
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  if (qNum) {
    const vp1 = page.getViewport({ scale: 1 });
    const scaleY = vp.height / vp1.height;
    const displayH = Math.round(vp.height / SCALE);
    if (currentStoredY !== null && !isNaN(currentStoredY)) {
      const yDisplay = Math.round(currentStoredY * scaleY / SCALE);
      if (yDisplay > 5 && yDisplay < displayH - 5) {
        showArrow(yDisplay, displayH, isAnswer);
        setTimeout(() => { viewport.scrollTop = Math.max(0, yDisplay - 80); }, 80);
        rendering = false;
        runDiagnostics();
        return;
      }
    }
    showArrow(40, displayH, isAnswer);
    setTimeout(() => { viewport.scrollTop = 0; }, 80);
  }
  rendering = false;
  runDiagnostics();
}

async function loadPdf(url, pageNum, qNum, isAnswer) {
  setLoading(true);
  arrow.style.display = 'none';
  try {
    const fetchUrl = url;
    if (fetchUrl === currentPdfUrl && currentPdfDoc) {
      currentPage = pageNum; currentQNum = qNum;
      await renderPage(currentPdfDoc, pageNum, qNum, isAnswer);
    } else {
      currentPdfUrl = fetchUrl;
      currentPdfDoc = null;
      canvas.style.display = 'none';
      placeholder.style.display = 'flex';
      const task = pdfjsLib.getDocument(fetchUrl);
      currentPdfDoc = await task.promise;
      currentPage = pageNum; currentQNum = qNum;
      await renderPage(currentPdfDoc, pageNum, qNum, isAnswer);
    }
  } catch(e) {
    console.error('PDF load error:', e);
    panelTitle.textContent = 'Error loading PDF';
    placeholder.style.display = 'flex';
    canvas.style.display = 'none';
  }
  setLoading(false);
}

function openQuestion(row, mode) {
  if (currentRow) currentRow.classList.remove('active');
  currentRow = row;
  row.classList.add('active');
  const paper  = row.dataset.paper;
  const qNum   = row.dataset.qnum;
  const qpUrl  = row.dataset.qpUrl;
  const msUrl  = row.dataset.msUrl;
  const qpPage = parseInt(row.dataset.qpPage);
  const msPage = parseInt(row.dataset.msPage);
  currentMode = mode;
  btnQMode.classList.toggle('active', mode === 'q');
  btnAMode.classList.toggle('active', mode === 'a');
  const url   = mode === 'q' ? qpUrl : msUrl;
  const page  = mode === 'q' ? qpPage : msPage;
  const label = mode === 'q' ? 'QP' : 'MS';
  const isAns = mode === 'a';
  currentStoredY = isAns ? parseFloat(row.dataset.msY) : parseFloat(row.dataset.qpY);
  panelTitle.textContent = `${paper} · Q${qNum} · ${label} p${page}`;
  if (!panelVisible) {
    panelVisible = true;
    pdfPanel.classList.remove('hidden');
    panelToggle.textContent = '⊞ Panel';
  }
  const panelHdrEl = document.getElementById('panel-hdr');
  if (panelHdrEl) {
    panelHdrEl.style.removeProperty('display');
    panelHdrEl.style.removeProperty('height');
    panelHdrEl.style.removeProperty('min-height');
    void panelHdrEl.offsetHeight;
  }
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
  currentQNum = qNum;
  loadPdf(url, page, qNum, isAns);
  btnOpenQP.onclick = () => alert('Would open: ' + row.dataset.qpFullId);
  btnOpenMS.onclick = () => alert('Would open: ' + row.dataset.msFullId);
}

document.querySelectorAll('.qrow').forEach(row => {
  row.querySelector('.btn-q').addEventListener('click', e => { e.stopPropagation(); openQuestion(row, 'q'); });
  row.querySelector('.btn-a').addEventListener('click', e => { e.stopPropagation(); openQuestion(row, 'a'); });
  row.addEventListener('click', () => openQuestion(row, currentMode || 'q'));
});

document.querySelectorAll('.nav-pill').forEach(pill => {
  pill.addEventListener('click', e => {
    e.preventDefault();
    const target = document.querySelector(pill.getAttribute('href'));
    if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
  });
});

function jumpToTopicHash() {
  const raw = decodeURIComponent(window.location.hash || '').replace(/^#/, '');
  if (!raw) return;
  const el = document.querySelector('[data-topic="' + CSS.escape(raw) + '"]');
  if (!el) return;
  const indexDiv = document.getElementById('index');
  setTimeout(() => {
    indexDiv.scrollTo({ top: Math.max(0, el.offsetTop - 80), behavior: 'instant' });
    el.classList.add('topic-flash');
    setTimeout(() => el.classList.remove('topic-flash'), 2300);
  }, 60);
}
window.addEventListener('DOMContentLoaded', jumpToTopicHash);
window.addEventListener('hashchange', jumpToTopicHash);

function runDiagnostics() {
  const hdrRect = document.getElementById('panel-hdr').getBoundingClientRect();
  const btnQRect = document.getElementById('btn-q-mode').getBoundingClientRect();
  const idx = document.getElementById('index');
  const diag = document.getElementById('diag');
  diag.textContent =
    'panel-hdr top: ' + hdrRect.top.toFixed(1) + ', height: ' + hdrRect.height.toFixed(1) + '\n' +
    'btn-q-mode top: ' + btnQRect.top.toFixed(1) + ' (should be ~60-100)\n' +
    'body.scrollTop: ' + document.body.scrollTop + '\n' +
    'index.scrollHeight: ' + idx.scrollHeight + ', scrollTop: ' + idx.scrollTop + '\n' +
    (btnQRect.top < 52 ? '*** BUG REPRODUCED — button hidden behind header ***' : '✓ looks healthy');
}
</script>
</body>
</html>
