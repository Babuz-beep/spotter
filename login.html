<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTTER — Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#0D1F2D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0f2535;border:1px solid #1e3a52;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.logo{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:700;letter-spacing:4px;color:#2d6ef5;margin-bottom:4px}
.logo span{color:#d97706}
.tagline{color:#6b8fa8;font-size:0.78rem;margin-bottom:32px}
h2{color:#e8f0f8;font-size:1rem;font-weight:600;margin-bottom:6px}
.sub{color:#6b8fa8;font-size:0.82rem;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;color:#8aa4bc;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.field input{width:100%;background:#0a1a27;border:1px solid #1e3a52;border-radius:8px;padding:12px 14px;color:#e8f0f8;font-family:'Sora',sans-serif;font-size:0.95rem;outline:none;transition:border-color .2s}
.field input:focus{border-color:#2d6ef5}
.field input::placeholder{color:#3a5a74}
.btn{width:100%;background:#2d6ef5;color:#fff;border:none;border-radius:8px;padding:13px;font-family:'Sora',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s}
.btn:hover{background:#1a5ce0}
.btn:disabled{background:#1a3347;color:#3a5a74;cursor:not-allowed}
.error{background:#2a0f0f;border:1px solid #5a1a1a;color:#f87171;border-radius:8px;padding:11px 14px;font-size:0.83rem;margin-top:16px;display:none}
.success{background:#0a2a1a;border:1px solid #1a5a2a;color:#4ade80;border-radius:8px;padding:11px 14px;font-size:0.83rem;margin-top:16px;display:none}
.hint{color:#3a5a74;font-size:0.73rem;margin-top:20px;text-align:center;line-height:1.6}
.pin-field{letter-spacing:4px;font-family:'JetBrains Mono',monospace;font-size:1.1rem;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">SPOT<span>TER</span></div>
  <div class="tagline">AQA Science Question Bank</div>
  <h2>Sign in to SPOTTER</h2>
  <p class="sub">Enter your school email address and the access PIN provided by your teacher.</p>
  <div class="field">
    <label>School email</label>
    <input type="email" id="email" placeholder="you@school.ac.uk" autocomplete="email" autocapitalize="none">
  </div>
  <div class="field">
    <label>School access PIN</label>
    <input type="text" id="pin" placeholder="••••••" maxlength="10" class="pin-field" autocomplete="off" inputmode="numeric">
  </div>
  <button class="btn" id="login-btn" onclick="doLogin()">Access SPOTTER →</button>
  <div class="error" id="error-msg"></div>
  <div class="success" id="success-msg"></div>
  <p class="hint">Don't know your PIN? Ask your teacher.<br>Use your school email — not Gmail or personal email.</p>
</div>

<script>
const API = '/auth.php';

// Check if already logged in
function getToken() {
  const ls = localStorage.getItem('spotter_token');
  if (ls) return ls;
  const match = document.cookie.match(/spotter_token=([^;]+)/);
  if (match) {
    localStorage.setItem('spotter_token', match[1]);
    return match[1];
  }
  return null;
}

const existingToken = getToken();
if (existingToken) {
  fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'verify_session', token: existingToken})
  }).then(r => r.json()).then(data => {
    if (data.valid) window.location.href = '/index.html';
  }).catch(() => {});
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pin = document.getElementById('pin').value.trim();
  const btn = document.getElementById('login-btn');

  if (!email) { showError('Please enter your school email address.'); return; }
  if (!pin) { showError('Please enter your access PIN.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'pin_login', email, pin})
    });
    const data = await resp.json();

    if (data.valid && data.token) {
      localStorage.setItem('spotter_token', data.token);
      localStorage.setItem('spotter_email', email);
      // Cookie set server-side already
      showSuccess('Signing you in…');
      setTimeout(() => { window.location.href = '/index.html'; }, 400);
    } else {
      showError(data.error || 'Incorrect PIN or email. Please check and try again.');
      btn.disabled = false;
      btn.textContent = 'Access SPOTTER →';
    }
  } catch (e) {
    showError('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Access SPOTTER →';
  }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
